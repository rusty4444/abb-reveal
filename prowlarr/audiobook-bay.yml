---
id: audiobook-bay
name: AudioBook Bay
description: "AudioBook Bay audiobooks, fetched through abb-reveal so base64 listing posts are visible."
language: en-US
type: public
encoding: UTF-8
links:
  # URL Prowlarr uses to reach this proxy. Both containers must share a Docker network.
  - http://abb-reveal:8080/

caps:
  categorymappings:
    - {id: audiobook, cat: Audio/Audiobook, desc: "Audiobooks"}
  modes:
    search: [q]
    book-search: [q]

settings: []

search:
  headers:
    User-Agent: ["Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"]
  paths:
    - path: /
  keywordsfilters:
    - name: re_replace
      args: ['[^\w]+', ' ']
    - name: tolower
    - name: trim
  inputs:
    s: "{{ .Keywords }}"
  rows:
    selector: div.post:has(div.postTitle h2 a)
  fields:
    category:
      text: audiobook
    title:
      selector: div.postTitle h2 a
    details:
      selector: div.postTitle h2 a
      attribute: href
    download:
      selector: div.postTitle h2 a
      attribute: href
    poster:
      selector: div.postContent img
      attribute: src
    description:
      selector: div.postInfo
    date:
      selector: div.postContent
      filters:
        - name: regexp
          args: 'Posted: (\d{1,2} \w{3,4} \d{4})'
        - name: replace
          args: ["Sept", "Sep"]
        - name: dateparse
          args: "d MMM yyyy"
    size:
      selector: div.postContent
      filters:
        - name: re_replace
          args: ["\\s+", " "]
        - name: regexp
          args: 'File Size: ?([\d\.]+ ?[KMGT]B)s?'
    seeders:
      text: 1
    leechers:
      text: 1
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1

download:
  headers:
    User-Agent: ["Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"]
  infohash:
    hash:
      selector: 'td:contains("Info Hash:") + td'
    title:
      selector: div.postTitle h1
